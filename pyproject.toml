[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crestix-xgb"
version = "0.1.0"
description = "XGBoost data pipeline and feature engineering for Crestix Probe urban flood forecasting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

