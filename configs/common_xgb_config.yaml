# ==============================================================================
# Crestix Probe — Common Pipeline XGBoost Model Configuration
# Aligns XGBoost with Person 1's common dataset, 43-feature schema,
# primary target (`target_depth_lead_30m`), and event-aware split (`baseline.yaml`).
# ==============================================================================

model:
  version: "2.0.0-common"
  model_type: "XGBRegressor"
  early_stopping_rounds: 35
  regressor_params:
    n_estimators: 450
    max_depth: 6
    learning_rate: 0.04
    subsample: 0.85
    colsample_bytree: 0.85
    min_child_weight: 4
    gamma: 0.05
    reg_alpha: 0.15
    reg_lambda: 1.2
    objective: "reg:squarederror"
    eval_metric: "rmse"
    random_state: 42
    n_jobs: -1

data:
  data_dir: "data/sample"
  baseline_config: "configs/baseline.yaml"
  primary_target_col: "target_depth_lead_30m"
  flood_label_col: "target_is_flooded_lead_30m"
  flood_threshold_m: 0.03

outputs:
  metrics_json: "metrics/common_evaluation_summary.json"
  predictions_csv: "metrics/common_test_predictions.csv"
  metadata_json: "artifacts/metadata/common_model_metadata.json"
