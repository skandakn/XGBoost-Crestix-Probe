# Hyperparameter Search Space for Crestix Probe XGBoost Model
# Used for event-based cross-validation tuning

search_strategy: "grid"
target_metric: "rmse"

parameters:
  max_depth:
    type: "choice"
    values: [4, 5, 6, 7, 8]
  learning_rate:
    type: "choice"
    values: [0.02, 0.04, 0.06, 0.08, 0.10]
  n_estimators:
    type: "choice"
    values: [300, 450, 600]
  subsample:
    type: "choice"
    values: [0.75, 0.85, 0.95]
  colsample_bytree:
    type: "choice"
    values: [0.75, 0.85, 0.95]
  min_child_weight:
    type: "choice"
    values: [2, 4, 6]
  reg_alpha:
    type: "choice"
    values: [0.05, 0.15, 0.30]
  reg_lambda:
    type: "choice"
    values: [0.8, 1.2, 1.8]

early_stopping_rounds: 35
